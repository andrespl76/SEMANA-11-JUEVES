{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catálogo UNCP{% endblock %}</title>
    <!-- Enlazamos nuestro CSS estático -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="{% url 'catalogo:home' %}" class="logo">⚙️ TechCatalog UNCP</a>
            <nav>
                <a href="{% url 'catalogo:home' %}">Inicio</a>
                <a href="{% url 'catalogo:catalogo' %}">Catálogo</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Aquí se inyectará el contenido de las otras plantillas -->
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 ISO93A | Desarrollo de Aplicaciones Web | Django MTV</p>
    </footer>
</body>
</html>
